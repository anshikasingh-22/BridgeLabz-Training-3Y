<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection Page</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Lucknow</option>
        <option>Delhi</option>
        <option>Mumbai</option>
        <option>Jaipur</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Manali</option>
        <option>Goa</option>
        <option>Jaipur</option>
        <option>Agra</option>
    </select>

    <!-- Summary -->
    <p>
        My selected country is India, state is Uttar Pradesh,
        city is Lucknow, and my favorite tourist place is Manali.
    </p>

</body>
</html>
