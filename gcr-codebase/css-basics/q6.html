<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
            <div class="caption">Beautiful Mountain</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1016/500/350" alt="Nature">
            <div class="caption">Green Nature</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1025/500/350" alt="Dog">
            <div class="caption">Cute Dog</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1035/500/350" alt="River">
            <div class="caption">Beautiful River</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1043/500/350" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1050/500/350" alt="Nature">
            <div class="caption">Nature View</div>
        </div>

    </main>

</body>
</html>
