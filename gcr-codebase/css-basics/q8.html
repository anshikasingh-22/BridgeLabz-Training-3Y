<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <aside>
            <h2>Menu</h2>

            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Messages</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main>

            <h2>Dashboard Overview</h2>

            <div class="content-container">

                <div class="content-box">
                    <h3>Total Students</h3>
                    <p>250</p>
                </div>

                <div class="content-box">
                    <h3>Completed Courses</h3>
                    <p>120</p>
                </div>

                <div class="content-box">
                    <h3>New Messages</h3>
                    <p>18</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
