<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Pricing</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

<main class="pricing">

    <article class="plan">
        <h2>Deluxe</h2>
        <p class="price">₹4,500</p>
        <p>Comfortable room</p>
        <p>Free Wi-Fi</p>
    </article>

    <article class="plan featured">
        <h2>Luxury Suite</h2>
        <p class="price">₹7,500</p>
        <p>Large room and balcony</p>
        <p>Breakfast included</p>
    </article>

    <article class="plan">
        <h2>Family Room</h2>
        <p class="price">₹6,000</p>
        <p>Room for family</p>
        <p>Free Wi-Fi</p>
    </article>

</main>

</body>
</html>
