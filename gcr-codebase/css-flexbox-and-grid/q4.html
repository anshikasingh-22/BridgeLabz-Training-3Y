<!DOCTYPE html>
<html lang="en">
<head>

    <title>Hotel Dashboard</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

<div class="dashboard">

    <header>
        <h1>Hotel Dashboard</h1>
    </header>

    <aside>
        <h2>Menu</h2>

        <a href="#">Dashboard</a>

        <a href="#">Facilities</a>
