<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

<header>
    <h1>CSS Selectors Practice</h1>
</header>

<main>
    <section class="content">

        <h2>Different Selectors</h2>

        <p>This is a normal paragraph.</p>

        <p class="highlight">
            This paragraph uses a class selector.
        </p>

        <p id="special">
            This paragraph uses an ID selector.
        </p>

        <input type="text" placeholder="Attribute selector">

        <h3>My Skills</h3>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Flexbox</li>
        </ul>

        <a href="#">Sample Link</a>

        <div class="parent">
            <p>Direct child paragraph.</p>

            <div>
                <p>Descendant paragraph.</p>
            </div>
        </div>

    </section>
</main>

</body>
</html>
