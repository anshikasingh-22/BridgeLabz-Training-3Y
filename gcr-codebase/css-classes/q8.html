<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main>
    <section class="comparison">

        <div class="box default-box">
            <h2>Default Box</h2>
            <p>
                This box uses content-box.
                Padding and border are added to the width.
            </p>
        </div>

        <div class="box border-box">
            <h2>Border-Box</h2>
            <p>
                This box uses border-box.
                Padding and border stay inside the width.
            </p>
        </div>

    </section>
</main>

</body>
</html>
