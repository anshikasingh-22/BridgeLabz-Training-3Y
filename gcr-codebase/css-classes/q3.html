<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header>
    <h1>Image Showcase</h1>
</header>

<main>
    <section class="gallery">

        <figure class="image-card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1011/500/350" alt="Nature">
                <div class="overlay"></div>
            </div>
            <figcaption>Nature View</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1016/500/350" alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1025/500/350" alt="Animal">
                <div class="overlay"></div>
            </div>
            <figcaption>Lovely Animal</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1035/500/350" alt="River">
                <div class="overlay"></div>
            </div>
            <figcaption>River View</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1043/500/350" alt="Beach">
                <div class="overlay"></div>
            </div>
            <figcaption>Peaceful Beach</figcaption>
        </figure>

    </section>
</main>

</body>
</html>
