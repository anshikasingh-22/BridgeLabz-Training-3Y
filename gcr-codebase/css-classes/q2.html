<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

<header>
    <h1>CSS Tooltip Demonstration</h1>
</header>

<main>
    <section class="tooltip-container">

        <div class="tooltip-box">
            HTML
            <span class="tooltip-text">HyperText Markup Language</span>
        </div>

        <div class="tooltip-box">
            CSS
            <span class="tooltip-text">Cascading Style Sheets</span>
        </div>

        <div class="tooltip-box">
            Flexbox
            <span class="tooltip-text">CSS Layout System</span>
        </div>

        <div class="tooltip-box">
            Grid
            <span class="tooltip-text">Two Dimensional Layout</span>
        </div>

    </section>
</main>

</body>
</html>
