<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Pseudo-Classes Demonstration</h1>
</header>

<main>
    <section class="examples">

        <div class="example">
            <a href="#">Hover Over This Link</a>
            <p>:hover changes the link color.</p>
        </div>

        <div class="example">
            <button>Click Me</button>
            <p>:active changes the button while clicking.</p>
        </div>

        <div class="example">
            <input type="text" placeholder="Click here">
            <p>:focus changes the input when selected.</p>
        </div>

        <div class="example">
            <ul>
                <li>First Item</li>
                <li>Second Item</li>
                <li>Third Item</li>
            </ul>
            <p>:nth-child() styles a list item.</p>
        </div>

    </section>
</main>

</body>
</html>
