<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

<header>
    <h1>My Mini UI</h1>
</header>

<main>
    <section class="main-card">

        <div class="image-section">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSz9kw5PE4HqmkTILumi-_VTs9yuLJvQIGl9FnAE8rfdA&s=10"
                alt="Nature Image"
            >
        </div>

        <div class="content-section">
            <h2>Contact Us</h2>

            <form>

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>

            </form>
        </div>

    </section>
</main>

</body>
</html>
