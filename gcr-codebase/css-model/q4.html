<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

<header>
    <h1>Shadows and Depth</h1>
</header>

<main>
    <section class="card-container">

        <article class="card shadow-one">
            <h2>Profile Card</h2>
            <p>This card uses a soft box shadow.</p>
        </article>

        <article class="card shadow-two">
            <h2>Content Card</h2>
            <p>This card uses a stronger shadow.</p>
        </article>

        <article class="card shadow-three">
            <h2>Info Card</h2>
            <p>This card creates a deep shadow effect.</p>
        </article>

    </section>
</main>

</body>
</html>
