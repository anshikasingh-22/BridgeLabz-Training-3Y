<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<header>
    <h1>CSS Box Model</h1>
</header>

<main>
    <section class="box-model">

        <div class="margin-layer">

            <div class="border-layer">

                <div class="padding-layer">

                    <div class="content-layer">
                        Content
                    </div>

                </div>

            </div>

        </div>

        <div class="description">
            <p><strong>Content:</strong> Actual information inside the box.</p>
            <p><strong>Padding:</strong> Space between content and border.</p>
            <p><strong>Border:</strong> Line surrounding the padding.</p>
            <p><strong>Margin:</strong> Space outside the border.</p>
        </div>

    </section>

    <section class="box-sizing-demo">
        <div class="default-box">
            Default Box
        </div>

        <div class="border-box">
            Border-box
        </div>
    </section>
</main>

</body>
</html>
