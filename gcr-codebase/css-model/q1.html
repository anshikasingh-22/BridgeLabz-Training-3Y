<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Borders and Padding</h1>
    <p>Different border styles and padding examples</p>
</header>

<main>
    <section class="box-container">

        <div class="box solid">
            <h2>Solid Border</h2>
            <p>This box uses a solid border.</p>
        </div>

        <div class="box dashed">
            <h2>Dashed Border</h2>
            <p>This box uses a dashed border.</p>
        </div>

        <div class="box double">
            <h2>Double Border</h2>
            <p>This box uses a double border.</p>
        </div>

        <div class="box groove">
            <h2>Groove Border</h2>
            <p>This box uses a groove border.</p>
        </div>

        <div class="box rounded">
            <h2>Rounded Corners</h2>
            <p>This box uses border-radius.</p>
        </div>

    </section>
</main>
</body>
</html>
