<!DOCTYPE html>
<html lang="en">
<head>

    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <header>

        <article class="profile-card">

            <h2>Emma</h2>
            <p>UI Designer</p>
        </article>

        <article class="profile-card">
            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500" alt="John">
            <h2>John</h2>
            <p>Cloud Engineer</p>
        </article>

    </main>

</body>
</html>
