<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <header>
        <h1>Before and After</h1>
        <p>Image Filter Comparison</p>
    </header>

    <main class="comparison">

        <figure class="image-box">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900" alt="Original">
            <figcaption>Before - Original</figcaption>
        </figure>

        <figure class="image-box filtered">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900" alt="Filtered">
            <figcaption>After - Filtered</figcaption>
        </figure>

    </main>

</body>
</html>
