<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>CSS Filter Effects</p>
    </header>

    <main class="gallery">

        <figure>
            <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Nature">
            <figcaption>Blur Effect</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=800" alt="Mountain">
            <figcaption>Grayscale Effect</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800" alt="Forest">
            <figcaption>Sepia Effect</figcaption>
        </figure>

        <figure>
            <img class="brightness" src="https://images.unsplash.com/photo-1511497584788-876760111969?w=800" alt="Trees">
            <figcaption>Brightness Effect</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Forest">
            <figcaption>Contrast Effect</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Landscape">
            <figcaption>Hue Rotate Effect</figcaption>
        </figure>

    </main>

    <footer>
        <p>Responsive Image Gallery</p>
    </footer>

</body>
</html>
